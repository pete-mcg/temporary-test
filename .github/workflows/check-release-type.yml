name: Check Release Type

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  check-release-type:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release_type from pull request body
        id: extract_release_type
        run: |
          PR_BODY=$(jq -r '.pull_request.body' "$GITHUB_EVENT_PATH")
          release_type=""

          if echo "$PR_BODY" | grep -Piq 'release type\s*:\s*patch'; then
            release_type="patch"
          elif echo "$PR_BODY" | grep -Piq 'release type\s*:\s*minor'; then
            release_type="minor"
          elif echo "$PR_BODY" | grep -Piq 'release type\s*:\s*major'; then
            release_type="major"
          fi

          # If no valid release type is found, exit with an error.
          if [ -z "$release_type" ]; then
            echo "::error:: No valid release type found in the merge commit message. Please include 'release type: patch', 'release type: minor', or 'release type: major'."
            exit 1
          fi

          echo "::notice:: Extracted release type: $release_type"
          echo "release_type=$release_type" >> $GITHUB_ENV
          echo "release_type=$release_type" >> $GITHUB_OUTPUT
          
      - name: Output release type
        run: |
          echo "Determined release type: ${{ env.release_type }}"

      - name: Set Job Summary
        run: |
          echo "### Release Type Check 📝" >> $GITHUB_STEP_SUMMARY
          echo "**Extracted Release Type:** \`${{ env.release_type }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="### Release Type Check 📝\n**Extracted Release Type:** \`${{ env.release_type }}\`"
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"body\": \"${COMMENT_BODY}\"}"


