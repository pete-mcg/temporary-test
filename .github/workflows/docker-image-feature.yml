name: Feature Docker Image CI

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: test

    steps:
    - name: GitHub Container Registry Login
      uses: docker/login-action@v3
      with:
        # Container registry username
        username: ${{ github.actor }}
        # Container registry password
        password: ${{ secrets.GITHUB_TOKEN }}
        # Container registry server url
        registry: ghcr.io
        
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags

    - name: Get commit SHA
      id: get_sha
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Get sanitised branch name
      id: branch
      run: echo "branch_name=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '--' | tr -cd '[:alnum:].-')" >> $GITHUB_OUTPUT

    - name: Get date and time
      id: date_time
      run: echo "date_time=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Build the Docker image
      run:
        docker build . --file WebApp.Dockerfile
          --build-arg VITE_BUILD_NUMBER=${{ github.run_number }}
          --build-arg VITE_APP_VERSION=feature-${{ github.run_number }}
          --build-arg VITE_ENVIRONMENT=Feature
          --tag ghcr.io/${{ github.repository }}-feature:feature;
        docker tag ghcr.io/${{ github.repository }}-feature:feature ghcr.io/${{ github.repository }}-feature:${{ steps.branch.outputs.branch_name }}-${{ steps.get_sha.outputs.short_sha }};
        docker tag ghcr.io/${{ github.repository }}-feature:feature ghcr.io/${{ github.repository }}-feature:${{ steps.branch.outputs.branch_name }}-$GITHUB_RUN_NUMBER;
        docker tag ghcr.io/${{ github.repository }}-feature:feature ghcr.io/${{ github.repository }}-feature:${{ steps.date_time.outputs.date_time }};
        docker push ghcr.io/${{ github.repository }}-feature:feature;
        docker push ghcr.io/${{ github.repository }}-feature:${{ steps.branch.outputs.branch_name }}-${{ steps.get_sha.outputs.short_sha }};
        docker push ghcr.io/${{ github.repository }}-feature:${{ steps.branch.outputs.branch_name }}-$GITHUB_RUN_NUMBER;
        docker push ghcr.io/${{ github.repository }}-feature:${{ steps.date_time.outputs.date_time }};
